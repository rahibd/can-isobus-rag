<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CAN-RAG · ISOBUS Document Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0F1720;
    --panel: #16212B;
    --panel-raised: #1B2833;
    --border: #24323D;
    --amber: #F5A623;
    --amber-dim: #7A5A22;
    --teal: #2DD4BF;
    --teal-dim: #1E6B62;
    --text: #E4EAEE;
    --text-muted: #7C8B99;
    --danger: #F2545B;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body {
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    background-color: var(--bg);
    background-blend-mode: overlay;
    opacity: 1;
  }

  .app {
    max-width: 760px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-raised);
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .brand-mark {
    font-size: 22px;
    color: var(--amber);
    line-height: 1;
  }

  .brand-text h1 {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.08em;
    margin: 0;
    font-weight: 600;
  }

  .brand-text p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  .bus-status {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--teal);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 6px var(--teal);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ---------- Messages ---------- */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 88%;
  }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .avatar {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
  }

  .msg.user .avatar {
    color: var(--amber);
    border-color: var(--amber-dim);
  }

  .msg.assistant .avatar {
    color: var(--teal);
    border-color: var(--teal-dim);
  }

  .avatar.thinking { animation: pulse 1.1s ease-in-out infinite; }
  .avatar.pop { animation: pop 0.35s ease; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.12); opacity: 0.65; }
  }

  @keyframes pop {
    0% { transform: scale(0.6); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .bubble {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 60px;
  }

  .msg.user .bubble { border-color: var(--amber-dim); }
  .msg.assistant .bubble { border-color: var(--teal-dim); }
  .msg.error .bubble { border-color: var(--danger); }

  .meta {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .text {
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.error .text { color: var(--danger); }

  /* typing dots */
  .dots { display: flex; gap: 4px; padding: 4px 0; }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- Composer ---------- */
  .composer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel-raised);
  }

  .prompt-glyph {
    font-family: var(--mono);
    color: var(--amber);
    font-size: 15px;
  }

  #input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
  }

  #input:focus { border-color: var(--teal-dim); }

  #sendBtn {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    background: var(--amber);
    color: #1a1200;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: 600;
  }

  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #sendBtn:not(:disabled):hover { filter: brightness(1.08); }

  @media (prefers-reduced-motion: reduce) {
    .dot, .avatar.thinking, .avatar.pop, .dots span { animation: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <div class="brand-text">
          <h1>CAN-RAG</h1>
          <p>ISOBUS document assistant · local model</p>
        </div>
      </div>
      <div class="bus-status"><span class="dot"></span>BUS ONLINE</div>
    </header>

    <main class="messages" id="messages">
      <div class="msg assistant">
        <div class="avatar">⚙️</div>
        <div class="bubble">
          <div class="meta">SYSTEM</div>
          <div class="text">Ask about anything in your loaded documents — PGNs, task controller behavior, bus load, address claiming, and so on.</div>
        </div>
      </div>
    </main>

    <form class="composer" id="composer">
      <span class="prompt-glyph">&gt;</span>
      <input id="input" type="text" placeholder="ask about PGNs, ISOBUS, bus load..." autocomplete="off" />
      <button type="submit" id="sendBtn">SEND</button>
    </form>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function timestamp() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(role, text, opts = {}) {
    const row = document.createElement('div');
    row.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar' + (opts.thinking ? ' thinking' : '');
    avatar.textContent = role === 'user' ? '🧑' : (opts.thinking ? '🤔' : '⚙️');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${role === 'user' ? 'YOU' : 'ASSISTANT'} · ${timestamp()}`;

    const textEl = document.createElement('div');
    textEl.className = 'text';

    if (opts.thinking) {
      const dots = document.createElement('div');
      dots.className = 'dots';
      dots.innerHTML = '<span></span><span></span><span></span>';
      textEl.appendChild(dots);
    } else {
      textEl.textContent = text;
    }

    bubble.appendChild(meta);
    bubble.appendChild(textEl);
    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    return { row, avatar, bubble, textEl };
  }

  function finishMessage(handle, text, opts = {}) {
    handle.avatar.classList.remove('thinking');
    handle.avatar.classList.add('pop');
    handle.avatar.textContent = opts.error ? '⚠️' : '💡';
    handle.textEl.textContent = text;
    if (opts.error) handle.row.classList.add('error');
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage('user', question);
    input.value = '';
    sendBtn.disabled = true;

    const pending = addMessage('assistant', '', { thinking: true });

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      finishMessage(pending, data.answer);
    } catch (err) {
      finishMessage(pending, `Could not get an answer: ${err.message}. Is LM Studio's Local Server running?`, { error: true });
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  input.focus();
</script>
</body>
</html>
